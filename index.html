<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Someone Special ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #020205; /* Deep Pitch Dark */
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            padding: 15px;
            position: relative;
        }

        html {
            height: -webkit-fill-available;
        }

        /* LIVE REAL SKY CANVAS BACKGROUND */
        #skyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* WATERMARK / SIGNATURE */
        .watermark {
            position: fixed;
            bottom: 15px;
            right: 18px;
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            z-index: 9999;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }

        /* Ambient Background Floating Hearts */
        .bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart-particle {
            position: absolute;
            color: rgba(255, 71, 87, 0.35);
            font-size: 18px;
            animation: floatUp 6s linear infinite;
            bottom: -30px;
            filter: drop-shadow(0 0 4px rgba(255, 71, 87, 0.6));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* PAGE MANAGEMENT */
        .page {
            display: none;
            width: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            z-index: 10;
        }

        .active {
            display: flex;
        }

        /* PAGE 1 INTRO CARD */
        .intro-box {
            text-align: center;
            z-index: 10;
            background: rgba(10, 8, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 71, 87, 0.25);
            max-width: 360px;
            width: 100%;
        }

        .intro-box h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            font-weight: 400;
            line-height: 1.4;
        }

        .glow-btn {
            padding: 14px 36px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: #ffffff;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 0 18px rgba(255, 71, 87, 0.7);
            animation: glowPulse 1.5s infinite alternate;
            transition: transform 0.2s;
        }

        .glow-btn:active {
            transform: scale(0.95);
        }

        @keyframes glowPulse {
            from {
                box-shadow: 0 0 10px #ff4757, 0 0 20px #ff4757;
            }
            to {
                box-shadow: 0 0 25px #ff4757, 0 0 40px #ff6b81;
            }
        }

        /* GLASS CARD FOR PAGE 2 & 3 */
        .card {
            background: rgba(12, 10, 24, 0.65);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1.2px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 32px 22px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85),
                        inset 0 0 15px rgba(255, 255, 255, 0.05),
                        0 0 25px rgba(255, 71, 87, 0.3);
            text-align: center;
            position: relative;
            transition: all 0.5s ease;
        }

        /* Music Button */
        .music-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.3s;
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        h1.title {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #ff4757;
            text-shadow: 0 0 12px rgba(255, 71, 87, 0.7);
            margin-top: 12px;
            margin-bottom: 18px;
            word-wrap: break-word;
        }

        /* Circular Photo Frame */
        .photo-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #ff4757, #ffa502, #ff6b81);
            box-shadow: 0 0 22px rgba(255, 71, 87, 0.7);
            animation: pulseGlow 2.5s infinite alternate;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #080612;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 12px rgba(255, 71, 87, 0.5); }
            100% { box-shadow: 0 0 30px rgba(255, 71, 87, 0.9), 0 0 18px rgba(255, 165, 2, 0.7); }
        }

        p.message {
            color: #f0f0f0;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 5px;
            min-height: 65px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Buttons Container */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 55px;
            width: 100%;
        }

        .btn {
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .yes-btn {
            background: linear-gradient(45deg, #ff2a5f, #ff4757);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.7);
            animation: heartBeat 1.4s infinite;
            z-index: 2;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.06); }
            28% { transform: scale(1); }
            42% { transform: scale(1.06); }
            70% { transform: scale(1); }
        }

        .no-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
            transition: top 0.2s ease, left 0.2s ease;
            backdrop-filter: blur(5px);
        }

        /* SUCCESS CARD SPECIAL STYLING */
        .success-box {
            display: none;
            animation: zoomIn 0.6s ease forwards;
            background: rgba(15, 12, 30, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 60px rgba(255, 71, 87, 0.45);
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 360px) {
            .card { padding: 25px 15px; }
            h1.title { font-size: 30px; }
            .photo-wrapper { width: 125px; height: 125px; }
            .btn { padding: 10px 24px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- REALISTIC NIGHT SKY CANVAS -->
    <canvas id="skyCanvas"></canvas>

    <!-- GANESH WATERMARK -->
    <div class="watermark">~ Ganesh ❤️</div>

    <!-- Ambient Heart Particles -->
    <div class="bg-hearts" id="heartContainer"></div>

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
    </audio>

    <!-- PAGE 1: INTRO SCREEN -->
    <div class="page active" id="page1">
        <div class="intro-box">
            <h2>I made something small for you 😅</h2>
            <button class="glow-btn" onclick="openPage2()">Let’s see ❤️</button>
        </div>
    </div>

    <!-- PAGE 2: MAIN CARD SCREEN -->
    <div class="page" id="page2">
        <div class="card" id="mainCard">
            <button class="music-btn" id="musicBtn" onclick="toggleAudio()">Pause ⏸️</button>
            
            <h1 class="title">Hey Roshika... ❤️</h1>

            <div class="photo-wrapper">
                <img src="bonquet.png" alt="Special Memory">
            </div>

            <!-- Typing Container for Page 2 -->
            <p class="message" id="typingMessage2"></p>

            <div class="btn-group" id="btnGroup2" style="display:none;">
                <button class="btn yes-btn" id="yesBtn" onclick="onYesClicked()">YES! 🥰</button>
                <button class="btn no-btn" id="noBtn" ontouchstart="escapeNoBtn(event)" onmouseover="escapeNoBtn(event)" onclick="escapeNoBtn(event)">NO 😜</button>
            </div>
        </div>

        <!-- PAGE 3: SUCCESS SCREEN -->
        <div class="card success-box" id="successCard">
            <h1 class="title" style="font-size: 40px; color: #fff; text-shadow: 0 0 20px #ff4757;">YES! 🎉❤️</h1>
            <div class="photo-wrapper" style="width: 135px; height: 135px;">
                <img src="thank.png" alt="Celebration">
            </div>
            
            <!-- Typing Container for Page 3 -->
            <p class="message" id="typingMessage3" style="font-size: 16px; color: #ffffff; font-weight: 500; text-shadow: 0 0 8px rgba(0,0,0,0.8);"></p>
        </div>
    </div>

    <script>
        /* REALISTIC DARK NIGHT SKY WITH REALISTIC MOON & TWINKLING STARS */
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];
        const numStars = 280; // Dense realistic stars count

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Realistic Star Class
        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.3; // Tiny realistic star dots
                this.alpha = Math.random();
                this.speed = Math.random() * 0.015 + 0.003;
                this.color = ['#ffffff', '#ffffff', '#e0f7fa', '#fff3e0'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.alpha += this.speed;
                if (this.alpha >= 1 || this.alpha <= 0.1) {
                    this.speed = -this.speed;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.abs(this.alpha);
                ctx.fill();
            }
        }

        // Shooting Star Class
        class ShootingStar {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width * 0.8;
                this.y = Math.random() * (canvas.height * 0.4);
                this.length = Math.random() * 70 + 30;
                this.speed = Math.random() * 8 + 5;
                this.alpha = 1;
                this.angle = Math.PI / 4.5;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.alpha -= 0.018;
                if (this.alpha <= 0 || this.x > canvas.width || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.angle) * this.length, this.y - Math.sin(this.angle) * this.length);
                ctx.stroke();
                ctx.restore();
            }
        }

        // DRAW REALISTIC MOON WITH CRATERS
        function drawMoon() {
            const moonX = canvas.width * 0.82;
            const moonY = 95;
            const radius = 38;

            ctx.save();

            // Very subtle natural atmosphere glow (not excessive ball glow)
            const glowGradient = ctx.createRadialGradient(moonX, moonY, radius, moonX, moonY, radius + 20);
            glowGradient.addColorStop(0, 'rgba(255, 253, 240, 0.18)');
            glowGradient.addColorStop(1, 'rgba(255, 253, 240, 0)');
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(moonX, moonY, radius + 20, 0, Math.PI * 2);
            ctx.fill();

            // Realistic Crescent / Full Moon Texture Surface
            ctx.beginPath();
            ctx.arc(moonX, moonY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f0ebd8'; // Natural moon off-white color
            ctx.fill();

            // Moon Craters (Darker texture spots)
            const craters = [
                {x: moonX - 10, y: moonY - 12, r: 7},
                {x: moonX + 12, y: moonY + 8, r: 9},
                {x: moonX - 8, y: moonY + 14, r: 6},
                {x: moonX + 5, y: moonY - 15, r: 5},
                {x: moonX - 18, y: moonY + 2, r: 4.5}
            ];

            ctx.fillStyle = 'rgba(200, 190, 170, 0.35)'; // Crater shade
            craters.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // Initialize Stars & Shooting Stars
        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }
        for (let i = 0; i < 2; i++) {
            shootingStars.push(new ShootingStar());
        }

        // Sky Animation Loop
        function animateSky() {
            // Pitch dark night gradient
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#020206');
            gradient.addColorStop(0.6, '#060512');
            gradient.addColorStop(1, '#0b081a');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawMoon();

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            shootingStars.forEach(sStar => {
                sStar.update();
                sStar.draw();
            });

            requestAnimationFrame(animateSky);
        }
        animateSky();

        /* MUSIC & PAGE CONTROLS */
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');

        const text2 = "Every moment with you feels like a dream come true. You make my life brighter and happier in every single way.\n\nWill you be my girlfriend and walk this journey with me? ❤️";
        let index2 = 0;

        function typePage2() {
            if (index2 < text2.length) {
                let char = text2.charAt(index2);
                document.getElementById("typingMessage2").innerHTML += (char === "\n") ? "<br>" : char;
                index2++;
                setTimeout(typePage2, 35);
            } else {
                document.getElementById("btnGroup2").style.display = "flex";
            }
        }

        const text3 = "Thank you for saying YES! You just made me the happiest person in the world! ✨💖";
        let index3 = 0;

        function typePage3() {
            if (index3 < text3.length) {
                let char = text3.charAt(index3);
                document.getElementById("typingMessage3").innerHTML += (char === "\n") ? "<br>" : char;
                index3++;
                setTimeout(typePage3, 40);
            }
        }

        function openPage2() {
            document.getElementById("page1").classList.remove("active");
            document.getElementById("page2").classList.add("active");

            music.play().then(() => {
                musicBtn.innerHTML = "Pause ⏸️";
            }).catch(err => console.log("Audio play blocked:", err));

            typePage2();
        }

        function toggleAudio() {
            if (music.paused) {
                music.play().then(() => {
                    musicBtn.innerHTML = "Pause ⏸️";
                }).catch(err => console.log("Audio play blocked:", err));
            } else {
                music.pause();
                musicBtn.innerHTML = "Play 🎵";
            }
        }

        let yesScale = 1;
        function escapeNoBtn(e) {
            if(e) e.preventDefault();
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            yesScale += 0.12;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function onYesClicked() {
            music.play().catch(e => console.log("Audio error:", e));

            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';

            createHearts(25);
            typePage3();

            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0 },
                    colors: ['#ff4757', '#ffffff', '#ff6b81', '#ffa502', '#ff2a5f']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1 },
                    colors: ['#ff4757', '#ffffff', '#ff6b81', '#ffa502', '#ff2a5f']
                });

                if (Date.now() < animationEnd) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        function createHearts(count = 15) {
            const container = document.getElementById('heartContainer');
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-particle');
                heart.innerHTML = ['❤️', '💖', '✨', '💕'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = Math.random() * 3 + 's';
                heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();
    </script>
</body>
</html>
